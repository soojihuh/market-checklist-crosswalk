<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>시장별 체크리스트 크로스워크</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#1c2430; --muted:#5d6877; --line:#dde2e9;
  --accent:#1f5fbf; --accent-bg:#e7f0fd;
  --direct:#1c7c4d; --direct-bg:#e4f4ea;
  --partial:#a15c00; --partial-bg:#fdf1dc;
  --only:#7a3fb0; --only-bg:#f1e8fa;
  --warn:#b3261e; --warn-bg:#fde8e6;
  --radius:8px;
  --grid:#7d8794;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161c; --panel:#1b212a; --ink:#e6eaf0; --muted:#9aa5b4; --line:#2e3744;
    --accent:#6ea3f2; --accent-bg:#1c2b44;
    --direct:#5cc58c; --direct-bg:#17301f;
    --partial:#f0b25a; --partial-bg:#3a2a10;
    --only:#c49af0; --only-bg:#2c1f3d;
    --warn:#ff8a80; --warn-bg:#3c1b19;
    --grid:#5d6877;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI","Malgun Gothic",system-ui,sans-serif}
header{padding:16px 24px 0;max-width:1400px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0}
.banner{margin:12px 0 0;padding:8px 12px;border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:var(--radius);font-size:13px}
nav{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line)}
nav button{background:none;border:none;border-bottom:3px solid transparent;padding:8px 14px;font:inherit;color:var(--muted);cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1400px;margin:0 auto;padding:16px 24px 48px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.controls label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
select,input[type=search]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:var(--panel);color:var(--ink);padding:6px 12px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
.chk{flex-direction:row!important;align-items:center;gap:6px!important;font-size:13px!important;color:var(--ink)!important}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.stat{padding:6px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--panel)}
.stat b{font-size:15px}
.jumppanel:empty{display:none}
.jumppanel{margin:10px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.jumphead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
.jumpclose{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer;padding:2px 8px}
.jumplist{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 10px}
.jumpitem{width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--accent);cursor:pointer;padding:4px 8px;border-radius:6px;font-size:13px;line-height:1.4}
.jumpitem:hover,.jumpitem:focus{background:var(--accent-bg);border-color:var(--accent);outline:none}
.jumpitem.dim{color:var(--muted)}
.cmprow,.cmpgroup,#cmplist,.panel li{scroll-margin-top:72px}
li.flash{animation:cmpflash 1.6s ease-out}
.cmprow.flash{animation:cmpflash 1.6s ease-out}
@keyframes cmpflash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 1px 3px rgba(0,0,0,.08)}}
.stat.click{cursor:pointer;user-select:none}
.stat.click:hover{border-color:var(--accent)}
.stat.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.stat.direct{color:var(--direct);background:var(--direct-bg);border-color:transparent}
.stat.partial{color:var(--partial);background:var(--partial-bg);border-color:transparent}
.stat.only{color:var(--only);background:var(--only-bg);border-color:transparent}
.marketnote{margin:10px 0 0;padding:8px 12px;border-radius:var(--radius);font-size:13px;background:var(--partial-bg);color:var(--partial)}
.marketnote.bad{background:var(--warn-bg);color:var(--warn)}
.group{margin:12px 0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.group>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 14px;font-weight:600}
.group>summary::-webkit-details-marker{display:none}
.group>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.group[open]>summary::before{transform:rotate(90deg)}
.gtitle{flex:1}
.gsub{font-weight:400;color:var(--muted);font-size:13px}
.cols{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.col{padding:10px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col+.col{border-left:1px solid var(--line)}
.colhead{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.empty{color:var(--muted);font-style:italic;font-size:13px;padding:6px 0}
.cardlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:10px;margin-top:12px}
.cardlist .sec{background:var(--panel)}
.stds{margin-top:6px;font-size:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.badge.std{background:var(--only-bg);color:var(--only);border-color:transparent}
.cmphead{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin-top:12px;font-weight:600}
.cmphead div{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.cmpgroup{margin:18px 0 6px;font-weight:600;padding-bottom:4px;border-bottom:1px solid var(--line)}
.cmpgroup .ko{font-weight:400;color:var(--muted);font-size:13px}
.cmprow{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--grid);border-radius:10px;background:var(--panel);margin:16px 0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cmpleft{padding:12px;background:var(--accent-bg);border-right:2px solid var(--grid)}
.cmpright{padding:12px}
.cmpleft .sec{background:var(--panel)}
.cmpright .sec{background:var(--bg)}
.cmpmatches{display:flex;flex-direction:column;gap:6px}
.cmpmore{margin-top:2px}
.cmpmore>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--partial);padding:4px 0}
.cmpmore[open]>summary{margin-bottom:6px}
.gctx{font-size:11px;color:var(--muted);margin-bottom:2px}
.cmpnone{border:1px dashed var(--line);border-radius:6px;padding:10px;color:var(--muted);font-size:13px}
@media (max-width:820px){ .cmprow,.cmphead{grid-template-columns:1fr} .cmpleft{border-right:none;border-bottom:2px solid var(--grid)} }
.glist{margin-top:12px}
.ggroup{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
.gside{position:sticky;top:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.gside .gref{font-size:12px;color:var(--accent);font-weight:600}
.gside .gname{font-weight:600;margin-top:2px}
.gside .gko{color:var(--muted);font-size:13px;margin-top:2px}
.gside .gcount{margin-top:8px}
.gitems{display:flex;flex-direction:column;gap:8px;min-width:0}
.gitems .sec{background:var(--panel)}
.gitems .sec .s{color:var(--ink)}
.gitems .sec .s.lang{color:var(--muted)}
@media (max-width:820px){ .ggroup{grid-template-columns:1fr} .gside{position:static} }
.sec{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--bg)}
.sec .ref{font-size:12px;color:var(--accent);font-weight:600}
.sec .t{font-weight:600}
.sec .s{font-size:13px;color:var(--muted);margin-top:2px;white-space:pre-line}
.sec .own{font-size:12px;margin-top:4px;padding:3px 6px;border-left:3px solid var(--only);background:var(--only-bg);border-radius:0 4px 4px 0}
.sec .lang{margin-top:3px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.p{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.badge.rev{background:var(--partial-bg);color:var(--partial);border-color:transparent}
.badge.v-official{background:var(--direct-bg);color:var(--direct);border-color:transparent}
.badge.v-handoff{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.badge.v-memory{background:var(--partial-bg);color:var(--partial);border-color:transparent}
.badge.v-unverified{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.pill.direct{background:var(--direct-bg);color:var(--direct)}
.pill.partial{background:var(--partial-bg);color:var(--partial)}
.pill.only{background:var(--only-bg);color:var(--only)}
.star{color:var(--partial)}
.gaps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.gaps ul{margin:6px 0 0;padding-left:18px}
.gaps li{font-size:13px;margin:2px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
.tablewrap{overflow-x:auto}
.log{list-style:none;padding:0;margin:0}
.log li{border-bottom:1px solid var(--line);padding:8px 0}
.log .d{font-weight:600;font-size:13px}
.muted{color:var(--muted)}
h2{font-size:16px;margin:18px 0 8px}
@media (max-width:820px){
  header,main{padding-left:16px;padding-right:16px}
  .cols,.gaps{grid-template-columns:1fr}
  .col+.col{border-left:none;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header>
  <h1>시장별 체크리스트 크로스워크</h1>
  <p class="sub">EU GSPR 허브 기준 토픽 매핑</p>
  <nav role="tablist">
    <button role="tab" id="tab-checklist" aria-selected="true" data-tab="checklist">체크리스트</button>
    <button role="tab" id="tab-compare" aria-selected="false" data-tab="compare">비교</button>
    <button role="tab" id="tab-review" aria-selected="false" data-tab="review">공식 검토</button>
    <button role="tab" id="tab-updates" aria-selected="false" data-tab="updates">업데이트 현황</button>
    <button role="tab" id="tab-about" aria-selected="false" data-tab="about">안내 · 토픽</button>
  </nav>
</header>
<main id="app"></main>

<script src="data/bundle.js"></script>
<script>
(function(){
"use strict";
var D = window.CHECKLIST_DATA;
var app = document.getElementById("app");
if(!D){ app.textContent = "data/bundle.js 를 불러오지 못했습니다. scripts/build_bundle.py 를 실행하세요."; return; }

/* ---------- helpers ---------- */
function h(tag, attrs){
  var el = document.createElement(tag);
  if(attrs){ Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if(v==null || v===false) return;
    if(k==="class") el.className = v;
    else if(k.slice(0,2)==="on") el.addEventListener(k.slice(2), v);
    else if(k==="text") el.textContent = v;
    else el.setAttribute(k, v===true ? "" : v);
  });}
  for(var i=2;i<arguments.length;i++) add(el, arguments[i]);
  return el;
}
function add(el, c){
  if(c==null || c===false) return;
  if(Array.isArray(c)) c.forEach(function(x){ add(el,x); });
  else el.appendChild(typeof c==="string" ? document.createTextNode(c) : c);
}
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){} return null; }

var TOPIC = {}; D.topics.forEach(function(t,i){ TOPIC[t.id] = t; t._i = i; });
var VERIF = {
  official:   ["원문 확인", "legislation.gov.au 등 공식 원문에서 이번에 확인"],
  handoff:    ["체크리스트 내용", "체크리스트(제공된 참고 자료) 기재 내용 — 공식 원문으로 재검증하지 못함"],
  memory:     ["기억 기반", "기억에 기반한 서술 — 원문 대조 필요"],
  unverified: ["미검증", "확인하지 못함 — 사용 금지/원문 확인 필요"]
};

var state = {
  tab: "checklist",
  m: store("cw.m") || "EU",
  view: store("cw.view") || "table",
  a: store("cw.a") || "EU",
  b: store("cw.b") || "CA",
  lang: store("cw.lang") || "both",
  status: "all",
  critical: false,
  hideUnver: false,
  officialOnly: false,
  verFilter: null,
  q: ""
};
if(D.marketOrder.indexOf(state.m)<0) state.m = D.marketOrder[0];
if(D.marketOrder.indexOf(state.a)<0) state.a = D.marketOrder[0];
if(D.marketOrder.indexOf(state.b)<0 || state.b===state.a) state.b = D.marketOrder.filter(function(m){return m!==state.a;})[0];

/* ---------- section matching: each section of A -> best matching sections of B ---------- */
var STOP = {};
("the,and,that,this,with,shall,must,should,from,which,such,been,have,into,their,them,they,where,when,than,also,other,only,used,use,any,all,are,for,not,but,its,may,can,has,was,will,each,these,those,under,between,device,devices,medical,manufacturer,manufacturers").split(",").forEach(function(w){ STOP[w] = 1; });
function words(s){
  if(s._w) return s._w;
  var set = {}, t = (s.summaryEn || "").toLowerCase().match(/[a-z]{4,}/g) || [];
  t.forEach(function(w){ if(!STOP[w]) set[w.replace(/(ing|ed|es|s)$/, "")] = 1; });
  s._w = set;
  return set;
}
function jacc(x, y){
  var i = 0, n = 0, m = 0, k;
  for(k in x){ n++; if(y[k]) i++; }
  for(k in y){ m++; }
  var u = n + m - i;
  return u ? i / u : 0;
}
var MATCH_REL = 0.7;   // 1위 점수 대비 이 비율 이상이면 대응 후보로 연결(경험적으로 정한 값 — 안내 탭에 명시)
var CORE_N = 3;        // 직접 대응에서 바로 보여주는 개수(나머지는 "더 보기"로 접음)
var CORE_P = 2;        // 부분 대응에서 바로 보여주는 개수
function matchSections(a, b){
  var A = D.markets[a].sections, B = D.markets[b].sections, byTopic = {}, usedB = {}, rows = [], bIndex = {};
  B.forEach(function(s, i){ bIndex[s.id] = i; });
  B.forEach(function(s){
    s.topics.forEach(function(t){ (byTopic[t.id] = byTopic[t.id] || []).push({sec: s, strength: t.strength}); });
  });
  A.forEach(function(sa){
    var cand = {};
    sa.topics.forEach(function(ta){
      (byTopic[ta.id] || []).forEach(function(x){
        var c = cand[x.sec.id] || (cand[x.sec.id] = {sec: x.sec, base: 0, direct: false});
        var pp = ta.strength === "primary" && x.strength === "primary";
        c.base += pp ? 3 : 1;
        if(pp) c.direct = true;
      });
    });
    var list = Object.keys(cand).map(function(k){
      var c = cand[k];
      c.score = c.base + 8 * jacc(words(sa), words(c.sec));
      return c;
    });
    // 개수 상한 없이, 각 그룹(직접/부분)에서 1위 점수의 MATCH_REL 비율 이상인 B 섹션을 모두 연결한다(1위는 항상 포함).
    // 직접 대응 그룹을 먼저, 그 뒤에 부분 대응 그룹을 보여준다.
    function pick(pool, coreN){
      pool.sort(function(x, y){ return y.score - x.score; });
      var cut = pool.length ? pool[0].score * MATCH_REL : 0;
      var top = pool.filter(function(c){ return c.score >= cut; });
      var core = {};
      top.slice(0, coreN).forEach(function(c){ core[c.sec.id] = 1; });          // 점수 상위 coreN개는 바로 표시, 나머지는 "더 보기"
      top.forEach(function(c){ c.core = !!core[c.sec.id]; });
      top.sort(function(x, y){ return bIndex[x.sec.id] - bIndex[y.sec.id]; });   // 점수순이 아니라 B 문서의 번호 순서
      top.forEach(function(c){ usedB[c.sec.id] = 1; });
      return top;
    }
    var dTop = pick(list.filter(function(c){ return c.direct; }), CORE_N);
    var pTop = pick(list.filter(function(c){ return !c.direct; }), CORE_P);
    rows.push({a: sa, status: dTop.length ? "direct" : (pTop.length ? "partial" : "none"), direct: dTop, partial: pTop, matches: dTop.concat(pTop)});
  });
  return {rows: rows, onlyB: B.filter(function(s){ return !usedB[s.id]; })};
}

/* ---------- rendering: compare ---------- */
function mname(m){ return D.markets[m].name.ko + (state.lang==="en" ? "" : ""); }
function mshort(m){ return m + " · " + (state.lang==="en" ? D.markets[m].name.en : D.markets[m].name.ko); }

function stdRow(s){
  if(!s.standards || !s.standards.length) return null;
  return h("div",{class:"stds"},
    h("span",{class:"muted", text:"관련 규격(제공 체크리스트 기준): "}),
    s.standards.map(function(x){ return badge(x.id + (x.ko ? " · "+x.ko : ""), "std", "공식 규정이 정한 목록이 아니라 제공된 체크리스트의 Relevant Standards 열 기준"); }));
}
function badge(text, cls, title){ return h("span",{class:"badge "+(cls||""), title:title||null}, text); }
function verBadge(v){ var x = VERIF[v] || VERIF.unverified; return badge(x[0], "v-"+v, x[1]); }

function secCard(entry, topicId){
  var s = entry.sec, lang = state.lang;
  var showEn = lang!=="ko", showKo = lang!=="en";
  var card = h("div",{class:"sec"},
    h("div",{class:"ref", text:s.ref}),
    showEn && h("div",{class:"t", text:s.titleEn}),
    showKo && h("div",{class:showEn?"t lang muted":"t", text:s.titleKo}),
    showEn && s.summaryEn && h("div",{class:"s", text:s.summaryEn}),
    showKo && s.summaryKo && h("div",{class:"s lang", text:s.summaryKo}),
    s.ownNote && h("div",{class:"own", text:"비고: "+s.ownNote}),
    stdRow(s),
    h("div",{class:"badges"},
      topicId && badge(entry.strength==="primary" ? "주(primary)" : "보조(secondary)", entry.strength==="primary"?"p":""),
      showKo && !s.summaryKo && badge("국문 미작성","rev","국문 번역이 아직 작성되지 않음 — 영문 원문만 표시"),
      verBadge(s.verification)
    )
  );
  return card;
}
var STATUS_LABEL = {direct: "직접 대응", partial: "부분 대응", none: "대응 없음"};
var jumpOpen = null;        // 상단 배지로 펼친 목록의 상태('direct'|'partial'|'none'|'onlyB')
var pendingGo = null;       // 필터를 풀고 다시 그린 직후 이동할 섹션 {kind:'row'|'onlyB', id}

function renderCompare(){
  var a = state.a, b = state.b, res = matchSections(a, b);
  var wrap = h("div");

  var selA = h("select",{id:"selA", onchange:function(e){ state.a=e.target.value; if(state.b===state.a) state.b=D.marketOrder.filter(function(m){return m!==state.a;})[0]; store("cw.a",state.a); store("cw.b",state.b); render(); }});

function buildTable(list){

  var rows = R.markets.map(function(m){
    var counts = {official:0, handoff:0, memory:0, unverified:0};
    D.markets[m.market].sections.forEach(function(s){ counts[s.verification] = (counts[s.verification]||0)+1; });
    var st = STATUS_TXT[m.status] || [m.status,""];
    return h("div",{class:"panel", style:"margin-top:12px"},
      h("div",null, h("b",{text:m.market+" · "+D.markets[m.market].name.ko+" "}), badge(st[0], st[1])),
      h("div",{class:"muted"}, m.source+" · "+m.version),
      m.sourceUrl && h("div",null, h("a",{href:m.sourceUrl, target:"_blank", rel:"noopener noreferrer", text:"열람한 출처"})),
      h("div",{class:"muted", text:"열람 범위: "+m.read}),
      h("div",{class:"badges"}, ["official","handoff","memory","unverified"].map(function(k){ return counts[k] ? [verBadge(k), h("span",{class:"muted", text:counts[k]+"개 "})] : null; })),
      m.findings.length ? h("div",null, h("b",{text:"검토에서 확인·수정된 점"}), h("ul",null, m.findings.map(function(f){ return h("li",{text:f}); }))) : null,
      m.open.length ? h("div",null, h("b",{text:"읽지 못했거나 미확인인 부분"}), h("ul",null, m.open.map(function(f){ return h("li",{text:f}); }))) : null
    );
  });
  wrap.appendChild(h("div",null, rows));
  app.appendChild(wrap);
}

/* ---------- rendering: updates ---------- */
function renderUpdates(){
  var S = D.sources, wrap = h("div");
  wrap.appendChild(h("p",{class:"muted", text:"월 1회 점검(GitHub Actions) 결과를 반영합니다. 기준선: "+S.baselineDate+". 자동 조회가 막힌 출처는 ‘수동 확인’으로 분리되며 우회 크롤링하지 않습니다."}));
  var rows = S.sources.map(function(s){
    return h("tr",null,
      h("td",{text:s.market}),
      h("td",null, h("div",{text:s.titleKo}), h("div",{class:"muted", text:s.titleEn}),
        s.url ? h("a",{href:s.url, target:"_blank", rel:"noopener noreferrer", text:"출처 링크"}) : h("span",{class:"muted", text:"공식 URL 미확보"}),
        s.note && h("div",{class:"muted", text:s.note})),
      h("td",{text:s.lastKnownVersion||"-"}),
      h("td",{text:s.lastKnownDate||"-"}),
      h("td",{text:s.lastChecked||"-"}),
      h("td",null, s.checkMethod==="manual" ? [badge("수동 확인","v-memory"), h("div",{class:"muted", text:s.manualReason||""})] : badge("자동","v-official"),
        s.lastStatus && h("div",{class:"muted", text:"최근 결과: "+s.lastStatus}))
    );
  });
  wrap.appendChild(h("div",{class:"panel tablewrap"},
    h("table",null,
      h("thead",null,h("tr",null,["시장","출처","현재 버전/개정","개정일","마지막 확인일","점검 방식"].map(function(x){return h("th",{text:x});}))),
      h("tbody",null,rows))));
  wrap.appendChild(h("h2",{text:"변경 이력"}));
  var E = D.changelog.entries.slice().sort(function(x,y){ return x.date < y.date ? 1 : x.date > y.date ? -1 : 0; });
  if(!E.length) wrap.appendChild(h("div",{class:"panel muted", text:"기록된 변경 이력이 없습니다. (월간 점검에서 변경이 발견되면 여기에 기록됩니다.)"}));
  else wrap.appendChild(h("div",{class:"panel"}, h("ul",{class:"log"}, E.map(function(e){
    return h("li",null,
      h("div",{class:"d"}, e.date+" · "+e.sourceId+" ", badge(e.type)),
      h("div",{text:e.summaryKo}),
      e.summaryEn && h("div",{class:"muted", text:e.summaryEn}),
      e.affectedSections && e.affectedSections.length ? h("div",{class:"muted", text:"영향 가능 섹션: "+e.affectedSections.join(", ")}) : null);
  }))));
  app.appendChild(wrap);
}

/* ---------- rendering: about ---------- */
function renderAbout(){
  var wrap = h("div");
  wrap.appendChild(h("div",{class:"panel"},
    h("b",{text:"대응 판정 규칙"}),
    h("ul",null,
      h("li",null,"비교 탭은 A로 고른 체크리스트의 섹션을 기준으로, B에서 내용이 가까운 섹션을 옆에 보여줍니다. 개수 상한은 없고, 가장 가까운 3개를 먼저 보여준 뒤 나머지는 '비슷한 섹션 N개 더 보기'로 접어 둡니다(열면 B 문서 순서)."),
      h("li",null,"각 섹션에는 공통 토픽이 내부적으로 연결되어 있고(주=primary / 보조=secondary), 같은 토픽을 가진 B 섹션에 점수(공통 토픽 + 문구 유사도)를 매겨, 1위 점수의 70% 이상인 섹션을 모두 연결합니다. 70%는 경험적으로 정한 값이며 규정상의 기준이 아닙니다. 토픽은 화면에 따로 나누어 보여주지 않습니다. 각 행에는 직접 대응 섹션을 먼저, 그 아래에 부분 대응 섹션을 보여줍니다(부분 대응은 먼저 2개만 보이고 나머지는 '더 보기')."),
      h("li",null,"A와 B 양쪽에서 주(primary) 토픽이 겹치면 “직접 대응”, 보조 토픽만 겹치면 “부분 대응”, 겹치는 토픽이 없으면 “대응 없음”입니다. B에서 어느 A 섹션과도 연결되지 않은 섹션은 비교 화면 맨 아래에 모아 보여줍니다."),
      h("li",null,"모든 매핑은 초안이며 RA 검토가 필요합니다.")
    ),
    h("b",{text:"확인 수준 배지"}),
    h("ul",null, Object.keys(VERIF).map(function(k){ return h("li",null, verBadge(k), " "+VERIF[k][1]); })),
    h("b",{text:"시장별 상태"}),
    h("ul",null, D.marketOrder.map(function(m){ var mk=D.markets[m]; return h("li",null, h("b",{text:m+" "}), mk.name.ko+" — "+mk.sections.length+"개 · ", verBadge(mk.verification), mk.titleNote ? h("div",{class:"muted", text:mk.titleNote}) : null); }))
  ));
  wrap.appendChild(h("h2",{text:"공통 토픽 ("+D.topics.length+")"}));
  wrap.appendChild(h("div",{class:"panel tablewrap"}, h("table",null,
    h("thead",null,h("tr",null,["ID","한국어","English","섹션 수"].map(function(x){return h("th",{text:x});}))),
    h("tbody",null, D.topics.map(function(t){
      var n = D.marketOrder.map(function(m){ var c = D.markets[m].sections.filter(function(s){return s.topics.some(function(x){return x.id===t.id;});}).length; return m+" "+c; }).join(" · ");
      return h("tr",null, h("td",{text:t.id}), h("td",null, t.critical && h("span",{class:"star",text:"★ "}), t.ko), h("td",{text:t.en}), h("td",{class:"muted", text:n}));
    })))));
  app.appendChild(wrap);
}

/* ---------- shell ---------- */
function render(){
  app.textContent = "";
  document.querySelectorAll("nav button").forEach(function(btn){ btn.setAttribute("aria-selected", String(btn.dataset.tab===state.tab)); });
  if(state.tab==="checklist") renderChecklist();
  else if(state.tab==="compare") renderCompare();
  else if(state.tab==="review") renderReview();
  else if(state.tab==="updates") renderUpdates();
  else renderAbout();
}
document.querySelectorAll("nav button").forEach(function(btn){
  btn.addEventListener("click", function(){ state.tab = btn.dataset.tab; render(); });
});
render();
})();
</script>
</body>
</html>
